# The fixture application on a fresh machine:  cp .env.example .env && docker compose up --build
# Then open http://127.0.0.1:8080. Live mode is configured in .env (see README).
name: zigzag

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  api:
    <<: *hardening
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: zigzag-api:local
    env_file: [.env] # secrets are injected at run time, never built into the image
    environment:
      ZIGZAG_DATA_DIR: /data
      ZIGZAG_FIXTURES_PATH: /app/fixtures/journeys.json
      ZIGZAG_ALLOWED_HOSTS: localhost,127.0.0.1,api
    volumes: [data:/data]
    expose: ["8000"] # reachable from the web container only; not published to the host
    stop_grace_period: 25s

  web:
    <<: *hardening
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: zigzag-web:local
    ports: ["127.0.0.1:${ZIGZAG_WEB_PORT:-8080}:8080"] # unauthenticated local POC: bound to localhost only
    depends_on:
      api: { condition: service_healthy }
    stop_grace_period: 10s

volumes:
  data:
