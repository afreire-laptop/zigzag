# Deterministic gates. No model credentials are used or needed: the API runs in fixture mode everywhere here.
# Each job calls the same package scripts used locally; the logic lives in the repository, not in this file.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests, coverage, boundaries, build, contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5 # installs the toolchain pinned in mise.toml
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --project apps/api
      - run: pnpm check

  e2e:
    name: Browser journeys (Playwright, axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --project apps/api
      - run: pnpm --filter @zigzag/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 14

  containers:
    name: Container builds and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/docker-smoke.sh

  ci-gate:
    # Require only this check in branch protection: GitHub treats a skipped required check as passing.
    name: CI gate
    if: always()
    needs: [quality, e2e, containers]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "A required job did not succeed: $RESULTS"; exit 1; }
          done
